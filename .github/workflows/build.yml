name: GKID Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      KERNEL_VERSION:
        description: "GKI LTS kernel line to build"
        default: "6.6"
        type: choice
        options:
          - "6.6"
      BUILD_KSU_SUSFS:
        description: "Build with KernelSU and its forks + SUSFS"
        type: boolean
        default: true
      NM:
        description: "Enable NoMount support"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev bc bison flex libssl-dev libelf-dev dwarves cpio

      - name: Run Build Script
        env:
          KERNEL_VERSION: "6.6"
          KSU: "BSU"
          KSU_SUSFS: "true"
          NM: "true"
          RUN_NUM: "-sky"
        run: |
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poco-m6-pro-5g-kernel
          path: artifacts/
